<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 615" width="438" height="615" role="img" aria-labelledby="title desc">
  <title id="title">Semantic / reasoning tags</title><desc id="desc">A template can carry more than one tag. Markers show the share of the 200 templates on a common 0–50% scale. Each row lists the count and percentage.</desc>
